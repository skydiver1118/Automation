name: Bootstrap Multi Bagger Run Timestamp

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-multibagger-run-timestamp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add hour-and-minute run timestamp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('multi-bagger-dashboard/index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new)

          text = replace_once(
              text,
              '.kpi small{margin-top:auto;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',
              '.kpi small{margin-top:auto;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#session{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}',
              'timestamp readability CSS',
          )

          date_function = "function date(v){if(!v)return'Unknown';return new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'))}"
          timestamp_function = date_function + "\nfunction timestamp(v){if(!v)return'Unknown';const d=new Date(v);if(Number.isNaN(d.getTime()))return'Unknown';return new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/New_York',timeZoneName:'short'}).format(d)}"
          text = replace_once(text, date_function, timestamp_function, 'timestamp formatter')

          text = replace_once(
              text,
              "$('session').textContent='Market session: '+date(x.market_session_date);",
              "$('session').textContent='Run: '+timestamp(x.recorded_at||x.generated_at)+' · Market session: '+date(x.market_session_date);",
              'snapshot run timestamp display',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate dashboard timestamp
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('multi-bagger-dashboard/index.html').read_text(encoding='utf-8')
          required = [
              "function timestamp(v)",
              "timeZone:'America/New_York'",
              "hour:'numeric'",
              "minute:'2-digit'",
              "Run: '+timestamp(x.recorded_at||x.generated_at)",
              "Market session: '+date(x.market_session_date)",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Missing timestamp elements: {missing}')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/multi-bagger-dashboard.js').write_text(scripts[0], encoding='utf-8')
          print('Multi Bagger run timestamp checks passed.')
          PY
          node --check /tmp/multi-bagger-dashboard.js

      - name: Commit dashboard timestamp
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multi-bagger-dashboard/index.html
          git commit -m "Multi Bagger: show run timestamp with hour and minute"
          git push origin HEAD:main
