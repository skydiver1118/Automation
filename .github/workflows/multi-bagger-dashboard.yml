name: Publish Multi Bagger Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multi-bagger-dashboard.yml'
      - 'multi-bagger-dashboard/**'
      - 'stock-project-v2/data/multi_bagger/**'
      - 'stock-project-v2/reports/multi_bagger/**'
      - 'stock-project-v2/scripts/store_multibagger_pass_scores.py'
  pull_request:
    paths:
      - '.github/workflows/multi-bagger-dashboard.yml'
      - 'multi-bagger-dashboard/**'
      - 'stock-project-v2/data/multi_bagger/**'
      - 'stock-project-v2/reports/multi_bagger/**'
      - 'stock-project-v2/scripts/store_multibagger_pass_scores.py'
permissions:
  contents: write
concurrency:
  group: stock-project-v2-daily
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: multi-bagger-dashboard/requirements.txt
      - name: Install Multi Bagger validation dependencies
        run: pip install -r multi-bagger-dashboard/requirements.txt
      - name: Validate final 25 and immutable history
        run: |
          python -m unittest discover -s multi-bagger-dashboard -p 'test_*.py' -v
          python -m unittest discover -s stock-project-v2/tests -p 'test_multibagger_pass_score_storage.py' -v
          python stock-project-v2/scripts/store_multibagger_pass_scores.py --project-root stock-project-v2 --verify-repository
      - name: Rebuild separate Multi Bagger site from verified saved evidence
        run: |
          python multi-bagger-dashboard/build_site.py --output .multi-bagger-pages
          node --check .multi-bagger-pages/app.syntax-check.js
          rm .multi-bagger-pages/app.syntax-check.js
      - name: Publish only Multi Bagger; preserve all sibling dashboards
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.multi-bagger-pages
          publish_branch: gh-pages
          destination_dir: multi-bagger
          keep_files: true
          force_orphan: false
          enable_jekyll: false
