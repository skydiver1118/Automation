name: Bootstrap Separate Multi Bagger Dashboard

on:
  push:
    branches:
      - feature/separate-multibagger-dashboard
    paths:
      - '.github/workflows/bootstrap-separate-multibagger-dashboard.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/separate-multibagger-dashboard

      - name: Materialize separate dashboard and protect existing Pages content
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          payloads = json.loads(r'{".github/workflows/multi-bagger-dashboard.yml":{"gzip_b64":"","sha256":"0c6badfeeffd6cbc1cbd9508adc519eb2e5c0d0ac320a0c0feaef0e0a5ae3fc8"},"multi-bagger-dashboard/index.html":{"gzip_b64":"","sha256":"b85c6148d2a2a20399150c896abd2d80da503fb16b8b23f63e42c0159810f520"},"multi-bagger-dashboard/styles.css":{"gzip_b64":"","sha256":"bc5ff5877be4336ea05d9b20c2104e3153e891a21f4245eceb3abc518e9608cf"},"multi-bagger-dashboard/app.js":{"gzip_b64":"","sha256":"ef796ed75e228ebd655907bebcda832de80b832f6412c8a09480e24a157a588b"},"multi-bagger-dashboard/README.md":{"gzip_b64":"","sha256":"333691eb42d27ea5aa647f991f4fdee6933390183449cdab8248368808b294e6"}}')
          for relative_path, record in payloads.items():
              data = gzip.decompress(base64.b64decode(record['gzip_b64']))
              actual = hashlib.sha256(data).hexdigest()
              if actual != record['sha256']:
                  raise SystemExit(f'Checksum mismatch for {relative_path}')
              path = Path(relative_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)

          stock_workflow = Path('.github/workflows/stock-project-v2.yml')
          text = stock_workflow.read_text(encoding='utf-8')
          old = '          publish_branch: gh-pages\n          force_orphan: true\n          enable_jekyll: false'
          new = '          publish_branch: gh-pages\n          keep_files: true\n          force_orphan: false\n          enable_jekyll: false'
          if text.count(old) != 1:
              raise SystemExit('Expected one Stock Project V2 Pages deployment block to patch')
          stock_workflow.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/bootstrap-separate-multibagger-dashboard.yml').unlink()
          print(f'Materialized {len(payloads)} permanent files and patched Stock Project V2 Pages preservation.')
          PY

      - name: Validate dashboard implementation
        shell: bash
        run: |
          node --check multi-bagger-dashboard/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path('stock-project-v2/data/multi_bagger/pass_scores/latest.json').read_text(encoding='utf-8'))
          if len(snapshot.get('stocks', [])) != 20:
              raise SystemExit('Expected 20 stocks in the migrated Multi Bagger snapshot')
          workflow = Path('.github/workflows/stock-project-v2.yml').read_text(encoding='utf-8')
          if 'keep_files: true' not in workflow or 'force_orphan: false' not in workflow:
              raise SystemExit('Stock Project V2 Pages preservation patch is missing')
          print('Dashboard source, latest snapshot, and Pages separation controls validated.')
          PY

      - name: Commit permanent implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/stock-project-v2.yml
          git add .github/workflows/multi-bagger-dashboard.yml
          git add multi-bagger-dashboard/
          git add -u .github/workflows/bootstrap-separate-multibagger-dashboard.yml
          git commit -m "Multi Bagger: publish separate dashboard"
          git push origin HEAD:feature/separate-multibagger-dashboard
