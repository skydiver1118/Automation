name: Stock Project V2 Daily

on:
  schedule:
    # Runs on weekdays after the US cash session. A separate NYSE calendar gate
    # below prevents holiday/non-session runs from producing results or email.
    - cron: '15 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-project-v2-daily
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stock-project-v2/requirements.txt

      - name: Install dependencies
        run: pip install -r stock-project-v2/requirements.txt

      - name: Check actual NYSE trading date
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import pandas_market_calendars as mcal
          tz = ZoneInfo('America/New_York')
          today = datetime.now(tz).date()
          schedule = mcal.get_calendar('NYSE').schedule(start_date=today, end_date=today)
          is_trading_day = not schedule.empty
          close_time = '' if schedule.empty else schedule.iloc[0]['market_close'].tz_convert(tz).isoformat()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'trade_date={today}\n')
              f.write(f'is_trading_day={str(is_trading_day).lower()}\n')
              f.write(f'close_time={close_time}\n')
          PY

      - name: Skip non-trading date
        if: steps.market.outputs.is_trading_day != 'true'
        run: echo "${{ steps.market.outputs.trade_date }} is not an NYSE trading date. No ranking, dashboard update, or email."

      - name: Run Stock Project V2
        if: steps.market.outputs.is_trading_day == 'true'
        run: python stock-project-v2/run_v2.py

      - name: Detect new completed session
        if: steps.market.outputs.is_trading_day == 'true'
        id: session
        shell: bash
        run: |
          if git diff --quiet -- stock-project-v2/latest_scores.csv stock-project-v2/latest_scores.json stock-project-v2/history/; then
            echo "new_session=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_session=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dashboard and stock detail pages
        if: steps.market.outputs.is_trading_day == 'true'
        run: python stock-project-v2/dashboard.py

      - name: Commit scores, history, and dashboard
        if: steps.market.outputs.is_trading_day == 'true'
        shell: bash
        run: |
          if git diff --quiet -- stock-project-v2/latest_scores.csv stock-project-v2/latest_scores.json stock-project-v2/history/ stock-project-v2/dashboard/; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-project-v2/latest_scores.csv stock-project-v2/latest_scores.json stock-project-v2/history/ stock-project-v2/dashboard/
          TRADE_DATE=$(python - <<'PY'
          import pandas as pd
          print(pd.read_csv('stock-project-v2/latest_scores.csv')['as_of'].iloc[0])
          PY
          )
          git commit -m "Stock V2: dashboard refresh ${TRADE_DATE}"
          git push

      - name: Stage dashboard at /stock-project-v2/
        if: steps.market.outputs.is_trading_day == 'true'
        shell: bash
        run: |
          rm -rf .pages
          mkdir -p .pages/stock-project-v2
          cp -R stock-project-v2/dashboard/. .pages/stock-project-v2/
          cat > .pages/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./stock-project-v2/"><title>Stock Project V2</title></head><body><a href="./stock-project-v2/">Open Stock Project V2 dashboard</a></body></html>
          HTML

      - name: Publish dashboard to gh-pages
        if: steps.market.outputs.is_trading_day == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.pages
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Email dashboard link
        if: steps.market.outputs.is_trading_day == 'true' && steps.session.outputs.new_session == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.STOCK_EMAIL_USERNAME }}
          password: ${{ secrets.STOCK_EMAIL_APP_PASSWORD }}
          subject: "Stock Project V2 results — ${{ steps.market.outputs.trade_date }}"
          to: 1118xmb@gmail.com
          from: "Stock Project V2 <${{ secrets.STOCK_EMAIL_USERNAME }}>"
          body: |
            Stock Project V2 has completed the ${{ steps.market.outputs.trade_date }} trading-session refresh.

            Dashboard:
            https://skydiver1118.github.io/Automation/stock-project-v2/

            GitHub fallback:
            https://github.com/skydiver1118/Automation/tree/main/stock-project-v2/dashboard

            The dashboard includes the 11-stock ranking, Long-Term / Short-Term / Buy-Now score history, and a detailed analysis page for every stock.
