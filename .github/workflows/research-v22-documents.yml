name: Complete v22 source capture
on:
  push:
    branches: ['research/mb-v22-scenarios-20260929']
    paths: ['.github/workflows/research-v22-documents.yml']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: multi-bagger-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r multi-bagger-dashboard/requirements.txt requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: v22-current-review-evidence
          run-id: 36660796326
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v22_current_evidence
      - run: python -u multi-bagger-dashboard/v22/tools/collect_current_review.py
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22-reviewed-source-capture
          path: v22_current_evidence/
          retention-days: 30
          if-no-files-found: error
