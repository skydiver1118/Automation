name: Bootstrap Multi Bagger Pass-Score Storage

on:
  push:
    branches:
      - 'feature/multibagger-pass-score-storage'
    paths:
      - '.github/workflows/bootstrap-multibagger-pass-score-storage.yml'
      - '.bootstrap_multibagger/**'

permissions:
  contents: write

concurrency:
  group: bootstrap-multibagger-pass-score-storage
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multibagger-pass-score-storage
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble checksummed implementation and migration inputs
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.bootstrap_multibagger/chunks')
          outputs = {
              'script': (
                  Path('stock-project-v2/scripts/store_multibagger_pass_scores.py'),
                  'a2882bbd711b49dbc2b011daa3b3c6b49243d782fda7cbf8ace96ca850ff87e8',
              ),
              'tests': (
                  Path('stock-project-v2/tests/test_multibagger_pass_score_storage.py'),
                  'a119d6623e61fe7834ce6e8fab7919690256af8dffa36a437dab34481dda3e5c',
              ),
              'score_schema': (
                  Path('stock-project-v2/data/multi_bagger/schemas/pass_scores.schema.json'),
                  '63c6411f31e55911e434ef87071688f7134a5c6cb49fac5a1fdca015fd1cc494',
              ),
              'evidence_schema': (
                  Path('stock-project-v2/data/multi_bagger/schemas/evidence_manifest.schema.json'),
                  '5d5112c36c06d4c50841203410619c9f75bc206fb05f48f16dbd6e932632d749',
              ),
              'migration': (
                  Path('.bootstrap_multibagger/migrate_legacy_dashboard.py'),
                  'ebe01d8a184651be463519afac3cdf68631fab0f0bc932af72c133fb1ac8edfc',
              ),
              'history_source': (
                  Path('.bootstrap_multibagger/Multi_Bagger_Dashboard_History.md'),
                  '7c2df74b03cab665a6874c4d23784091e6410afecd2f4cb248c779179531957d',
              ),
          }

          for prefix, (target, expected_sha256) in outputs.items():
              chunks = sorted(root.glob(f'{prefix}.*.b64'))
              if not chunks:
                  raise SystemExit(f'No bootstrap chunks found for {prefix}.')
              encoded = ''.join(path.read_text(encoding='ascii').strip() for path in chunks)
              payload = base64.b64decode(encoded, validate=True)
              actual = hashlib.sha256(payload).hexdigest()
              if actual != expected_sha256:
                  raise SystemExit(f'{prefix} checksum mismatch: {actual} != {expected_sha256}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              print(f'Assembled {target} ({len(payload)} bytes).')
          PY

      - name: Reconstruct and persist the legacy September 3 snapshot
        shell: bash
        run: |
          python .bootstrap_multibagger/migrate_legacy_dashboard.py \
            .bootstrap_multibagger/Multi_Bagger_Dashboard_History.md \
            stock-project-v2/.multibagger_bootstrap_input/snapshot.json \
            stock-project-v2/.multibagger_bootstrap_input/evidence.json

          python stock-project-v2/scripts/store_multibagger_pass_scores.py \
            stock-project-v2/.multibagger_bootstrap_input/snapshot.json \
            --evidence stock-project-v2/.multibagger_bootstrap_input/evidence.json \
            --project-root stock-project-v2

      - name: Verify migrated artifact checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              'stock-project-v2/data/multi_bagger/pass_scores/2026-09-03.json': '70e71eb9fa15b42860d9f692816bce1416558a17d4ffd9c6f65c4a5ad0929751',
              'stock-project-v2/data/multi_bagger/pass_scores/latest.json': '70e71eb9fa15b42860d9f692816bce1416558a17d4ffd9c6f65c4a5ad0929751',
              'stock-project-v2/data/multi_bagger/evidence/2026-09-03.json': '4f26de6452dc0245602a5afb73bc65e59114e83458e7a444a44c208f80240563',
              'stock-project-v2/data/multi_bagger/history/pass_score_history.csv': 'a1b354c72263b5d4516cc217ff2752e83031ee9d733146b8f045ea7a7e2bc31c',
              'stock-project-v2/reports/multi_bagger/2026-09-03.md': '7a1361b3d7f41b38a22c581a0e454526d17ccec64b4a4d5b6fb007412aa74b98',
          }
          for raw_path, expected_sha256 in expected.items():
              path = Path(raw_path)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected_sha256:
                  raise SystemExit(f'{path} checksum mismatch: {actual} != {expected_sha256}')
              print(f'Verified {path}.')
          PY

      - name: Validate implementation and repository artifacts
        shell: bash
        run: |
          python -m py_compile stock-project-v2/scripts/store_multibagger_pass_scores.py
          python -m unittest discover \
            -s stock-project-v2/tests \
            -p 'test_multibagger_pass_score_storage.py' \
            -v
          python stock-project-v2/scripts/store_multibagger_pass_scores.py \
            --project-root stock-project-v2 \
            --verify-repository

      - name: Replace bootstrap material with the final implementation
        shell: bash
        run: |
          rm -rf .bootstrap_multibagger stock-project-v2/.multibagger_bootstrap_input
          git rm .github/workflows/bootstrap-multibagger-pass-score-storage.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Multi Bagger: materialize six-pass score archive'
          git push origin HEAD:feature/multibagger-pass-score-storage
