name: Bootstrap Multi Bagger Price Column

on:
  push:
    branches:
      - feature/multibagger-price-column
    paths:
      - '.github/workflows/bootstrap-multibagger-price-column.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multibagger-price-column

      - name: Add price column to standalone dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('multi-bagger-dashboard/index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new)

          text = replace_once(
              text,
              '.ticker{border:0;background:none;color:var(--blue);font-weight:900;cursor:pointer;padding:0}.score',
              '.ticker{border:0;background:none;color:var(--blue);font-weight:900;cursor:pointer;padding:0}.price{font-weight:850}.score',
              'price CSS',
          )
          text = replace_once(
              text,
              '<a href="./data/pass_scores/latest.json" download>Latest JSON</a><a href="./data/history/pass_score_history.csv" download>History CSV</a>',
              '<a href="./data/pass_scores/latest.json" download>Latest JSON</a><a href="./data/prices/latest.json" download>Price JSON</a><a href="./data/history/pass_score_history.csv" download>History CSV</a>',
              'price download link',
          )
          text = replace_once(
              text,
              '<th>Rank</th><th>Ticker</th><th>Market cap</th>',
              '<th>Rank</th><th>Ticker</th><th>Price</th><th>Market cap</th>',
              'price header placement',
          )
          text = replace_once(
              text,
              '<footer>Source of truth: immutable Multi Bagger JSON and append-only history stored in GitHub.</footer>',
              '<footer>Source of truth: immutable Multi Bagger JSON and append-only history; prices use a separate dated market-session layer.</footer>',
              'price provenance footer',
          )
          text = replace_once(
              text,
              'const state={snapshot:null,stocks:[]};const $=id=>document.getElementById(id);',
              'const state={snapshot:null,stocks:[],prices:{},priceMeta:null};const $=id=>document.getElementById(id);',
              'price state',
          )
          score_line = '''function score(v,d){if(v===null||v===undefined)return'<span title="Not captured">—</span>';const n=Number(v),c=n>=80?'hi':n>=50?'mid':'lo';return`<span class="score ${c}">${esc(v)}</span>${d===undefined?'':delta(d)}`}'''
          price_functions = score_line + '''
function money(v,c='USD'){const n=Number(v);if(!Number.isFinite(n))return'—';const digits=Math.abs(n)<1?4:2;return new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD',minimumFractionDigits:digits,maximumFractionDigits:digits}).format(n)}
function price(s){const p=state.prices?.[s.ticker];if(!p||p.price_usd===null||p.price_usd===undefined)return'<span title="Price not available for this snapshot">—</span>';const label=money(p.price_usd,p.currency||'USD'),asOf=p.as_of?'Regular-session close '+p.as_of:'Regular-session close';return`<span class="price" title="${esc(asOf)}">${esc(label)}</span>`}'''
          text = replace_once(text, score_line, price_functions, 'price formatting functions')
          text = replace_once(
              text,
              '''function render(){const rows=stocks();$('summary').textContent=`Showing ${rows.length} of ${state.stocks.length} records.`;''',
              '''function render(){const rows=stocks(),priceNote=state.priceMeta?.market_session_date?' Prices: '+date(state.priceMeta.market_session_date)+' regular-session close.':' Prices unavailable.';$('summary').textContent=`Showing ${rows.length} of ${state.stocks.length} records.${priceNote}`;''',
              'price summary',
          )
          text = replace_once(
              text,
              '''<td><button class="ticker" data-t="${esc(s.ticker)}">${esc(s.ticker)}</button></td><td>${esc(s.market_cap_display||'—')}</td>''',
              '''<td><button class="ticker" data-t="${esc(s.ticker)}">${esc(s.ticker)}</button></td><td>${price(s)}</td><td>${esc(s.market_cap_display||'—')}</td>''',
              'ranking price cell',
          )
          text = replace_once(
              text,
              '<tr><td colspan="10" class="empty">No matching records.</td></tr>',
              '<tr><td colspan="11" class="empty">No matching records.</td></tr>',
              'ranking empty colspan',
          )
          text = replace_once(
              text,
              '''<div class="metrics"><div class="metric"><span>Market cap</span><strong>${esc(s.market_cap_display||'—')}</strong></div>''',
              '''<div class="metrics"><div class="metric"><span>Price</span><strong>${price(s)}</strong></div><div class="metric"><span>Market cap</span><strong>${esc(s.market_cap_display||'—')}</strong></div>''',
              'detail price metric',
          )
          text = replace_once(
              text,
              '''state.snapshot=x;state.stocks=x.stocks;$('date').textContent=date(x.run_date);''',
              '''state.snapshot=x;state.stocks=x.stocks;try{const pr=await fetch('./data/prices/latest.json',{cache:'no-store'});if(pr.ok){const px=await pr.json();state.prices=px.prices||{};state.priceMeta=px}else{console.warn('Price layer HTTP '+pr.status)}}catch(priceError){console.warn('Price layer unavailable',priceError)}$('date').textContent=date(x.run_date);''',
              'price data load',
          )
          path.write_text(text, encoding='utf-8')

          readme = Path('multi-bagger-dashboard/README.md')
          readme_text = readme.read_text(encoding='utf-8').rstrip() + '''

## Price column

- `build_price_snapshot.py` retrieves the regular-session close for the dashboard snapshot's `market_session_date`.
- Published price data is stored separately at `multi-bagger/data/prices/latest.json`.
- Price data does not come from, modify, or merge with the Stock Project V2 dashboard.
'''
          readme.write_text(readme_text, encoding='utf-8')
          PY

      - name: Validate patched dashboard
        shell: bash
        run: |
          python -m py_compile multi-bagger-dashboard/build_price_snapshot.py
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('multi-bagger-dashboard/index.html').read_text(encoding='utf-8')
          required = [
              '<th>Ticker</th><th>Price</th><th>Market cap</th>',
              './data/prices/latest.json',
              'colspan="11"',
              '<span>Price</span><strong>${price(s)}</strong>',
          ]
          missing = [value for value in required if value not in html]
          if missing:
              raise SystemExit(f'Missing dashboard price elements: {missing}')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/multi-bagger-dashboard.js').write_text(scripts[0], encoding='utf-8')
          print('Dashboard price-column source checks passed.')
          PY
          node --check /tmp/multi-bagger-dashboard.js

      - name: Commit patched dashboard source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multi-bagger-dashboard/index.html multi-bagger-dashboard/README.md
          git commit -m "Multi Bagger: show stock price after ticker"
          git push origin HEAD:feature/multibagger-price-column
