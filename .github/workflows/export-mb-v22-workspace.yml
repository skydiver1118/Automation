name: Export Multi Bagger v22 workspace
on:
  push:
    branches: ['feature/mb-v22-integration-20260929']
    paths: ['.github/workflows/export-mb-v22-workspace.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            multi-bagger-dashboard
            stock-project-v2/methodology
            stock-project-v2/data/multi_bagger
            stock-project-v2/scripts
            stock-project-v2/tests
            stock-project-v2/reports/multi_bagger
            .github/workflows
      - name: Export authoritative source, versioned specifications and sibling baselines
        run: |
          mkdir -p workspace
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          names=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines()
          roots=['multi-bagger-dashboard','stock-project-v2/methodology','stock-project-v2/data/multi_bagger','stock-project-v2/scripts','stock-project-v2/tests','stock-project-v2/reports/multi_bagger','.github/workflows']
          extra=[p for p in names if re.search(r'(multibagger|multi.bagger|feasibility)',p,re.I) and re.search(r'(v22|v2[._]2|calibrat)',p,re.I) and not any(p.startswith(x+'/') for x in roots)]
          Path('workspace/repository_paths.json').write_text(json.dumps(names,indent=2))
          Path('workspace/extra_v22_paths.json').write_text(json.dumps(extra,indent=2))
          with open('workspace/source.tar','wb') as f:subprocess.run(['git','archive','HEAD',*roots,*extra],stdout=f,check=True)
          Path('workspace/base_commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          Path('workspace/stock_v2_baseline.txt').write_text(subprocess.check_output(['git','ls-tree','-r','HEAD','stock-project-v2'],text=True))
          subprocess.run(['git','fetch','--depth=1','origin','gh-pages'],check=True)
          Path('workspace/published_tree.txt').write_text(subprocess.check_output(['git','ls-tree','-r','FETCH_HEAD'],text=True))
          Path('workspace/published_build.json').write_bytes(subprocess.check_output(['git','show','FETCH_HEAD:multi-bagger/build.json']))
          print('Extra v22 artifacts:',extra)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mb-v22-current-workspace
          path: workspace/
          retention-days: 7
