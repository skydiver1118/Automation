name: Multi Bagger Daily Market Evidence 2026-09-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mb-daily-market-20260904.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install yfinance pandas numpy
      - name: Build market and technical evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          from datetime import datetime, timezone
          import numpy as np
          import pandas as pd
          import yfinance as yf

          tickers = ['IREN','AMPX','APLD','BKSY','RKLB','FIGR','NBIS','WULF','ZETA','TSSI','RZLV','CRMD','EVLV','RR','GRRR','AXTI','SOUN','POET','SERV','SSII']
          benches = ['QQQ','SMH']
          symbols = tickers + benches
          raw = yf.download(symbols, period='18mo', interval='1d', auto_adjust=False, group_by='ticker', threads=True, progress=False)
          if raw.empty:
              raise SystemExit('No market data returned')

          def series(sym, col):
              try:
                  return raw[sym][col].dropna().astype(float)
              except Exception:
                  return pd.Series(dtype=float)

          def pct_ret(s, n):
              s=s.dropna()
              return float(s.iloc[-1]/s.iloc[-1-n]-1) if len(s)>n else None

          def rsi(s, n=14):
              d=s.diff(); up=d.clip(lower=0).ewm(alpha=1/n,adjust=False).mean(); dn=(-d.clip(upper=0)).ewm(alpha=1/n,adjust=False).mean(); x=100-100/(1+up/dn.replace(0,np.nan));
              return float(x.iloc[-1]) if len(x) and pd.notna(x.iloc[-1]) else None

          def macd(s):
              e12=s.ewm(span=12,adjust=False).mean(); e26=s.ewm(span=26,adjust=False).mean(); m=e12-e26; sig=m.ewm(span=9,adjust=False).mean(); h=m-sig
              return tuple(float(x.iloc[-1]) if pd.notna(x.iloc[-1]) else None for x in (m,sig,h))

          def adx(high, low, close, n=14):
              up=high.diff(); down=-low.diff(); plus=up.where((up>down)&(up>0),0.0); minus=down.where((down>up)&(down>0),0.0)
              tr=pd.concat([(high-low),(high-close.shift()).abs(),(low-close.shift()).abs()],axis=1).max(axis=1); atr=tr.ewm(alpha=1/n,adjust=False).mean()
              pdi=100*plus.ewm(alpha=1/n,adjust=False).mean()/atr; mdi=100*minus.ewm(alpha=1/n,adjust=False).mean()/atr
              dx=100*(pdi-mdi).abs()/(pdi+mdi).replace(0,np.nan); x=dx.ewm(alpha=1/n,adjust=False).mean()
              return float(x.iloc[-1]) if len(x) and pd.notna(x.iloc[-1]) else None

          def clamp(x,a=0,b=100): return max(a,min(b,x))
          def lin(x,x0,x1,y0,y1):
              if x1==x0:return y0
              return y0+(x-x0)*(y1-y0)/(x1-x0)

          bench_ret={}
          for b in benches:
              c=series(b,'Close')
              bench_ret[b]={n:pct_ret(c,n) for n in (21,63,126,252)}

          out={'generated_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'market_session_date':None,'price_basis':'latest completed regular session close before 2026-09-04 market open','technical_method':'MB technical v2.2: trend 30%, momentum 20%, relative-strength/volume 20%, support-risk 20%, catalyst-confirmation proxy 10%','stocks':{}}
          session_dates=[]

          for tkr in tickers:
              c=series(tkr,'Close'); h=series(tkr,'High'); l=series(tkr,'Low'); v=series(tkr,'Volume')
              if len(c)<60:
                  out['stocks'][tkr]={'status':'insufficient_price_history'}; continue
              idx=c.index.intersection(h.index).intersection(l.index).intersection(v.index); c=c.loc[idx];h=h.loc[idx];l=l.loc[idx];v=v.loc[idx]
              price=float(c.iloc[-1]); prev=float(c.iloc[-2]); session=str(pd.Timestamp(c.index[-1]).date()); session_dates.append(session)
              ma20=float(c.rolling(20).mean().iloc[-1]); ma50=float(c.rolling(50).mean().iloc[-1]); ma200=float(c.rolling(200).mean().iloc[-1]) if len(c)>=200 else None
              r=rsi(c); m,ms,mh=macd(c); a=adx(h,l,c); vol20=float(v.rolling(20).mean().iloc[-1]); vr=float(v.iloc[-1]/vol20) if vol20>0 else None
              ret1=pct_ret(c,21); ret3=pct_ret(c,63); ret6=pct_ret(c,126); ret12=pct_ret(c,252)
              rs={}
              for label,n,val in [('1m',21,ret1),('3m',63,ret3),('6m',126,ret6),('12m',252,ret12)]:
                  bvals=[bench_ret[b][n] for b in benches if bench_ret[b][n] is not None]
                  rs[label]=None if val is None or not bvals else val-float(np.mean(bvals))
              high52=float(c.tail(252).max()); low52=float(c.tail(252).min())
              drawdown=price/high52-1 if high52 else None

              # Trend: reward MA positioning/alignment while avoiding binary jumps.
              trend=0
              trend += clamp(lin(price/ma20-1,-.12,.12,0,30),0,30)
              trend += clamp(lin(price/ma50-1,-.20,.20,0,30),0,30)
              if ma200:
                  trend += clamp(lin(price/ma200-1,-.30,.30,0,25),0,25)
                  trend += 15 if ma20>ma50>ma200 else (8 if ma20>ma50 or ma50>ma200 else 0)
              else:
                  trend += 12.5
                  trend += 7.5 if ma20>ma50 else 0
              trend=clamp(trend)

              # Momentum: RSI centered around strong-but-not-extreme 62 plus MACD histogram.
              rsi_score=50 if r is None else clamp(100-abs(r-62)*2.6)
              macd_norm=0 if mh is None else mh/max(price,1e-9)
              macd_score=clamp(50+macd_norm*1800)
              momentum=.55*rsi_score+.45*macd_score

              # Relative strength/volume.
              rsvals=[x for x in [rs['1m'],rs['3m'],rs['6m']] if x is not None]
              rsavg=float(np.mean(rsvals)) if rsvals else 0
              rs_score=clamp(50+rsavg*140)
              dayret=price/prev-1
              vol_score=50 if vr is None else clamp(50 + (min(vr,3)-1)*18*(1 if dayret>=0 else -1))
              rsvol=.75*rs_score+.25*vol_score

              # Support/risk: prefer meaningful pullbacks that remain above long trend.
              dd=drawdown if drawdown is not None else 0
              if dd>=-.08: pullback_score=50
              elif dd>=-.25: pullback_score=lin(dd,-.25,-.08,85,50)
              elif dd>=-.45: pullback_score=lin(dd,-.45,-.25,55,85)
              else: pullback_score=35
              longtrend_score=70 if (ma200 and price>=ma200) else (45 if ma200 and price>=.9*ma200 else 25)
              support=.65*pullback_score+.35*longtrend_score

              # Market-reaction catalyst proxy: recent 5d direction + ADX confirmation.
              ret5=pct_ret(c,5) or 0
              dir_score=clamp(50+ret5*250)
              adx_score=50 if a is None else clamp(30+(a-15)*2.2)
              catalyst=.7*dir_score+.3*adx_score

              tech=round(.30*trend+.20*momentum+.20*rsvol+.20*support+.10*catalyst)
              tech=int(clamp(tech))

              market_cap=None; shares=None
              try:
                  tk=yf.Ticker(tkr)
                  fi=tk.fast_info
                  market_cap=getattr(fi,'market_cap',None)
                  shares=getattr(fi,'shares',None)
                  if market_cap is None or not math.isfinite(float(market_cap)):
                      info=tk.get_info() or {}
                      market_cap=info.get('marketCap')
                      shares=shares or info.get('sharesOutstanding')
              except Exception:
                  market_cap=None
              if market_cap is None and shares:
                  market_cap=float(shares)*price
              market_cap=int(round(float(market_cap))) if market_cap is not None and math.isfinite(float(market_cap)) else None

              out['stocks'][tkr]={
                  'status':'ok','as_of':session,'price':round(price,4),'day_change_pct':round(dayret*100,2),'market_cap_usd':market_cap,
                  'ma20':round(ma20,4),'ma50':round(ma50,4),'ma200':round(ma200,4) if ma200 else None,
                  'dist20_pct':round((price/ma20-1)*100,2),'dist50_pct':round((price/ma50-1)*100,2),'dist200_pct':round((price/ma200-1)*100,2) if ma200 else None,
                  'rsi14':round(r,2) if r is not None else None,'macd':round(m,4) if m is not None else None,'macd_signal':round(ms,4) if ms is not None else None,'macd_hist':round(mh,4) if mh is not None else None,
                  'adx14':round(a,2) if a is not None else None,'volume_ratio_20d':round(vr,2) if vr is not None else None,
                  'return_1m_pct':round(ret1*100,2) if ret1 is not None else None,'return_3m_pct':round(ret3*100,2) if ret3 is not None else None,'return_6m_pct':round(ret6*100,2) if ret6 is not None else None,'return_12m_pct':round(ret12*100,2) if ret12 is not None else None,
                  'rs_vs_qqq_smh_1m_pct':round(rs['1m']*100,2) if rs['1m'] is not None else None,'rs_vs_qqq_smh_3m_pct':round(rs['3m']*100,2) if rs['3m'] is not None else None,'rs_vs_qqq_smh_6m_pct':round(rs['6m']*100,2) if rs['6m'] is not None else None,'rs_vs_qqq_smh_12m_pct':round(rs['12m']*100,2) if rs['12m'] is not None else None,
                  'high_52w':round(high52,4),'low_52w':round(low52,4),'drawdown_from_52w_high_pct':round(dd*100,2),
                  'technical_components':{'trend':round(trend,1),'momentum':round(momentum,1),'relative_strength_volume':round(rsvol,1),'support_risk':round(support,1),'catalyst_confirmation_proxy':round(catalyst,1)},
                  'weekly_technical_score':tech
              }

          out['market_session_date']=max(session_dates) if session_dates else None
          path=Path('stock-project-v2/data/multi_bagger/evidence/2026-09-04-market.json')
          path.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({k:{'price':v.get('price'),'mcap':v.get('market_cap_usd'),'tech':v.get('weekly_technical_score')} for k,v in out['stocks'].items()},indent=2))
          PY
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-project-v2/data/multi_bagger/evidence/2026-09-04-market.json
          git commit -m 'Multi Bagger: add Sep 4 market and technical evidence'
          git push
