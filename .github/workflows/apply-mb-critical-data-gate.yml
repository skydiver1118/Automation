name: Apply Multi Bagger critical-data score gate
# Research-only migration: September 7 is a full-day market closure; retain September 4 market data.
# Retry after browser warning-copy assertion was made wording-robust.
on:
  push:
    branches: ['feature/mb-critical-data-gate-20260907']
    paths: ['.github/workflows/apply-mb-critical-data-gate.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mb-critical-data-gate-20260907
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: multi-bagger-dashboard/requirements.txt
      - name: Preserve immutable history and Stock V2 baseline
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          roots=['stock-project-v2','multi-bagger-dashboard/monitoring/runs']
          d={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for root in roots for p in Path(root).rglob('*') if p.is_file()}
          Path('/tmp/critical-baseline.json').write_text(json.dumps(d))
          PY
      - name: Install source policy patches
        run: python .migration/mb-critical-data/install.py
      - name: Install validation dependencies
        run: |
          pip install -r multi-bagger-dashboard/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Apply research-only no-score policy and authorized rerank
        run: python -u multi-bagger-dashboard/apply_critical_data_policy.py | tee /tmp/critical-summary.json
      - name: Run all Multi Bagger and legacy storage tests
        run: |
          python -m unittest discover -s multi-bagger-dashboard -p 'test_*.py' -v
          python -m unittest discover -s stock-project-v2/tests -p 'test_multibagger_pass_score_storage.py' -v
          python stock-project-v2/scripts/store_multibagger_pass_scores.py --project-root stock-project-v2 --verify-repository
          python multi-bagger-dashboard/watchlist.py validate
      - name: Verify no critical-data stock has a current investment score or rank
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          x=json.loads(Path('multi-bagger-dashboard/monitoring/latest.json').read_text())
          r=json.loads(Path('multi-bagger-dashboard/watchlist_registry.json').read_text())
          expected={'FIGR','RKLB','GRRR','QBTS','SOUN','POET','OKLO','APLD','SMR','EOSE','RZLV','SERV'}
          missing={s['ticker'] for s in x['stocks'] if s['metadata']['score_eligibility']['status']=='missing_critical_data'}
          assert missing==expected,(missing,expected)
          for s in x['stocks']:
              q=s['metadata']['score_eligibility'];z=s['metadata']['research']
              if not q['scoreable']:
                  assert z['research_mb_score'] is None and z['research_ev_score'] is None
                  assert s['metadata']['tier_rank'] is None
          action=[s['ticker'] for s in sorted([s for s in x['stocks'] if s['metadata']['tier']=='action'],key=lambda s:s['metadata']['tier_rank'])]
          assert action==['ETN','ZETA','HUBB','CRMD','VST','AXTI','KTOS','AVAV','EVLV','BKSY'],action
          assert x['market_session_date']=='2026-09-04' and not x['metadata']['critical_data_policy']['market_refresh_performed']
          baseline=json.loads(Path('/tmp/critical-baseline.json').read_text())
          for path,h in baseline.items():
              p=Path(path)
              if path.startswith('multi-bagger-dashboard/monitoring/runs/') and not p.exists():raise AssertionError(path)
              if p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()!=h:raise AssertionError('Changed preserved file: '+path)
          print(json.dumps({'action':action,'unscored':sorted(missing),'market_session':x['market_session_date']},indent=2))
          PY
      - name: Build and browser-test the updated dashboard
        run: |
          python multi-bagger-dashboard/build_site.py --output .multi-bagger-pages
          node --check .multi-bagger-pages/app.syntax-check.js
          python multi-bagger-dashboard/browser_smoke.py --site .multi-bagger-pages --output browser-proof
          rm .multi-bagger-pages/app.syntax-check.js
      - name: Preserve proof
        if: always()
        run: |
          mkdir -p critical-proof
          cp -r browser-proof critical-proof/browser 2>/dev/null || true
          cp .multi-bagger-pages/build.json critical-proof/build.json 2>/dev/null || true
          cp multi-bagger-dashboard/monitoring/latest.json critical-proof/latest.json 2>/dev/null || true
          cp multi-bagger-dashboard/watchlist_registry.json critical-proof/watchlist_registry.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mb-critical-data-gate-proof
          path: critical-proof/
          retention-days: 30
      - name: Commit only tested Multi Bagger application/data changes
        run: |
          git diff --exit-code -- stock-project-v2 .github/workflows
          find multi-bagger-dashboard -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multi-bagger-dashboard
          git diff --cached --stat
          git commit -m 'Multi Bagger: withhold scores for missing critical data and rerank scoreable Action10'
          git push origin HEAD:feature/mb-critical-data-gate-20260907
