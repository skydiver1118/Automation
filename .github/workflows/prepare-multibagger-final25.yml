name: Prepare Multi Bagger 25 workspace
on:
  push:
    branches: ['feature/multibagger-final25-20260906']
    paths: ['.github/workflows/prepare-multibagger-final25.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            multi-bagger-dashboard
            stock-project-v2/data/multi_bagger
            stock-project-v2/scripts
            stock-project-v2/tests
            stock-project-v2/reports/multi_bagger
            stock-project-v2/methodology
            .github/workflows
      - name: Package workspace without touching source files
        run: |
          mkdir -p workspace-artifact
          git archive HEAD multi-bagger-dashboard stock-project-v2/data/multi_bagger stock-project-v2/scripts stock-project-v2/tests stock-project-v2/reports/multi_bagger stock-project-v2/methodology .github/workflows > workspace-artifact/workspace.tar
          git rev-parse HEAD > workspace-artifact/base_commit.txt
          git ls-tree -r HEAD stock-project-v2/dashboard > workspace-artifact/stock_v2_dashboard_baseline.txt
      - uses: actions/upload-artifact@v4
        with:
          name: multibagger-final25-workspace
          path: workspace-artifact/
          retention-days: 7
