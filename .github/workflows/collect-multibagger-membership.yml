name: Collect Multi Bagger ETF evidence
on:
  push:
    branches: ['feature/multibagger-final25-20260906']
    paths: ['.github/workflows/collect-multibagger-membership.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read primary fund holdings
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,json,hashlib,datetime,urllib.request
          from pathlib import Path
          out=Path('membership');out.mkdir()
          tickers='IREN AMPX APLD BKSY RKLB FIGR NBIS WULF ZETA TSSI RZLV CRMD EVLV RR GRRR AXTI SOUN POET SERV SSII KTOS AVAV HUBB VST ETN'.split()
          funds={'IVV':('239726','ishares-core-s-p-500-etf','S&P 500'),'IWB':('239707','ishares-russell-1000-etf','Russell 1000'),'IWM':('239710','ishares-russell-2000-etf','Russell 2000'),'IJH':('239763','ishares-core-s-p-mid-cap-etf','S&P MidCap 400'),'ITA':('239502','ishares-u-s-aerospace-defense-etf','U.S. aerospace & defense benchmark')}
          records=[]
          for fund,(pid,slug,index) in funds.items():
              url=f'https://www.ishares.com/us/products/{pid}/{slug}/latest-holdings.csv'
              rec={'fund':fund,'benchmark':index,'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'holdings':[]}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  text=urllib.request.urlopen(req,timeout=25).read().decode('utf-8-sig')
                  lines=text.splitlines();h=next(i for i,l in enumerate(lines) if l.startswith('Ticker,') or l.startswith('"Ticker",'))
                  rec['as_of_header']=' | '.join(l for l in lines[:h] if 'as of' in l.lower())
                  rec['source_sha256']=hashlib.sha256(text.encode()).hexdigest()
                  for row in csv.DictReader(io.StringIO('\n'.join(lines[h:]))):
                      t=(row.get('Ticker') or '').strip()
                      if t in tickers:
                          rec['holdings'].append({'ticker':t,'name':row.get('Name'),'weight_pct':row.get('Weight (%)',row.get('Market Weight',row.get('Weight'))),'sector':row.get('Sector'),'exchange':row.get('Exchange')})
                  rec['status']='retrieved';(out/f'{fund}.csv').write_text(text)
              except Exception as e:rec['status']='unavailable';rec['error']=str(e)
              records.append(rec);print(json.dumps(rec))
          (out/'membership.json').write_text(json.dumps({'scope':'Five primary ETF files; holdings are evidence of ETF exposure, not an exhaustive index membership certification. Absence is only absence from these files.','funds':records},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multibagger-25-membership
          path: membership/
          retention-days: 30
