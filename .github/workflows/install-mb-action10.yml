name: Install and test Multi Bagger Action10
on:
  push:
    branches: ['feature/mb-action10-candidate-first']
    paths: ['.github/workflows/install-mb-action10.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mb-action10-candidate-first
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and install app patch only; never write workflow files with the runner token
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path,PurePosixPath
          chunks=[Path(f'.migration/action10/part{i}.b64').read_text().strip() for i in range(4)]
          packed=base64.b64decode(''.join(chunks),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='64e38e2fcc11ba193475ff2184b0156a59bd706f9159ff3d6eb01b651cba58b2'
          raw=lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='a820a14ec5c531cded65827692ac639f9e2a67ee89b5b60b7c9d126f177d0d53'
          paths=set()
          allowed={'.github/workflows/multi-bagger-dashboard.yml','.github/workflows/multi-bagger-refresh.yml','.github/workflows/multi-bagger-candidate-intake.yml'}
          for line in raw.decode().splitlines():
              if not line.startswith(('--- ','+++ ')):continue
              name=line[4:].split('\t')[0]
              if name=='/dev/null':continue
              name=name[2:];p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name.startswith('multi-bagger-dashboard/') or name in allowed,name
              paths.add(name)
          assert len(paths)==18
          old={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('stock-project-v2/data/multi_bagger').rglob('*') if p.is_file()}
          Path('/tmp/mb-action10-old.json').write_text(json.dumps(old))
          Path('/tmp/action10.patch').write_bytes(raw)
          subprocess.run(['git','apply','--check','--exclude=.github/workflows/*','/tmp/action10.patch'],check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','/tmp/action10.patch'],check=True)
          p=Path('multi-bagger-dashboard/watchlist_runtime.py');text=p.read_text()
          old_gate='if len(f)<253 or str(f.index[-1].date())!=target:'
          assert text.count(old_gate)==1
          text=text.replace(old_gate,'if len(f)<200 or str(f.index[-1].date())!=target:')
          old_return="out['return_'+name]=a.iloc[-1]/a.iloc[-1-n]-1"
          assert text.count(old_return)==1
          text=text.replace(old_return,old_return+' if len(a)>n else None')
          p.write_text(text)
          Path('multi-bagger-dashboard/test_recent_listing.py').write_text('''"""Recent IPOs need 200 real sessions, not a fabricated one-year history."""
          import unittest
          import numpy as np
          import pandas as pd
          from watchlist_runtime import technical
          class RecentListingTests(unittest.TestCase):
              def test_recent_listing_without_12_month_return(self):
                  x=np.arange(215);c=50+.04*x+np.sin(x/3)
                  f=pd.DataFrame({'Close':c,'Adj Close':c,'High':c+1,'Low':c-1,'Volume':1000000+x*100},index=pd.bdate_range(end='2026-09-04',periods=215))
                  t=technical(f,'2026-09-04')
                  self.assertIsNone(t['return_12m'])
                  self.assertTrue(np.isfinite(t['ma200']))
                  self.assertTrue(np.isfinite(t['return_3m']))
                  with self.assertRaises(ValueError):technical(f.tail(199),'2026-09-04')
          ''')
          print('Installed app-only patch; workflows unchanged; recent-listing missingness regression added')
          PY
      - name: Install monitoring dependencies
        run: pip install -r multi-bagger-dashboard/requirements.txt
      - name: Seed Action10 and Candidates20
        run: |
          python multi-bagger-dashboard/watchlist_runtime.py --mode seed
          python multi-bagger-dashboard/watchlist.py validate
      - name: Live common-date monitoring for all 30; no notifications or publication
        run: python multi-bagger-dashboard/watchlist_runtime.py --mode weekly
      - name: Run 41 calendar, membership, data and storage regression tests
        run: |
          python -m unittest discover -s multi-bagger-dashboard -p 'test_*.py' -v
          python -m unittest discover -s stock-project-v2/tests -p 'test_multibagger_pass_score_storage.py' -v
          python stock-project-v2/scripts/store_multibagger_pass_scores.py --project-root stock-project-v2 --verify-repository
      - name: Build and verify boundaries
        run: |
          python multi-bagger-dashboard/build_site.py --output .multi-bagger-pages
          node --check .multi-bagger-pages/app.syntax-check.js
          rm .multi-bagger-pages/app.syntax-check.js
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          for name,h in json.loads(Path('/tmp/mb-action10-old.json').read_text()).items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          x=json.loads(Path('multi-bagger-dashboard/monitoring/latest.json').read_text())
          assert x['metadata']['action_count']==10 and x['metadata']['candidate_count']==20
          assert not x['metadata']['weekly_review']['automatic_swaps']
          print(json.dumps({'members':x['universe_size'],'refresh':x['metadata']['refresh_summary']},indent=2))
          assert not subprocess.check_output(['git','diff','--name-only','--','stock-project-v2','.github/workflows'],text=True).strip()
          PY
      - name: Retain validated source and site
        if: always()
        run: |
          mkdir -p action10-artifact
          cp -r .multi-bagger-pages action10-artifact/site 2>/dev/null || true
          cp -r multi-bagger-dashboard/monitoring action10-artifact/monitoring 2>/dev/null || true
          cp multi-bagger-dashboard/watchlist_registry.json action10-artifact/registry.json 2>/dev/null || true
          tar -czf action10-artifact/source.tar.gz multi-bagger-dashboard .github/workflows/multi-bagger-dashboard.yml .github/workflows/multi-bagger-refresh.yml .github/workflows/multi-bagger-candidate-intake.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mb-action10-validated
          path: action10-artifact/
          retention-days: 14
      - name: Commit application only; temporary workflows will be removed through connector
        run: |
          rm -rf .migration/action10
          find multi-bagger-dashboard -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --exit-code -- .github/workflows stock-project-v2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add multi-bagger-dashboard
          git diff --cached --stat
          git commit -m 'Multi Bagger: Action10 plus Candidates, candidate-first intake, verified daily/weekly monitoring'
          git push origin HEAD:feature/mb-action10-candidate-first
