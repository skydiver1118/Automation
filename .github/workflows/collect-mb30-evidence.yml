name: Collect MB30 research evidence
on:
  push:
    branches: ['feature/mb30-evidence-repair-20260906']
    paths: ['multi-bagger-dashboard/collect_evidence30.py', '.github/workflows/collect-mb30-evidence.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            multi-bagger-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r multi-bagger-dashboard/requirements.txt lxml beautifulsoup4
      - run: python -u multi-bagger-dashboard/collect_evidence30.py
      - name: Check read-only collection
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mb30-primary-and-financial-evidence
          path: mb30_evidence/
          retention-days: 30
          if-no-files-found: error
