name: Finish MB30 evidence repair
on:
  push:
    branches: ['feature/mb30-evidence-repair-20260906']
    paths: ['.github/workflows/finish-mb30-evidence.yml']
permissions:
  contents: write
  actions: read
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MB_EVIDENCE_ROOT: ${{ github.workspace }}/retained_evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mb30-evidence-repair-20260906
          submodules: false
          sparse-checkout: |
            multi-bagger-dashboard
            stock-project-v2/data/multi_bagger
            stock-project-v2/scripts
            stock-project-v2/tests
            stock-project-v2/reports/multi_bagger
            .migration/evidence30
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve baseline and recover complete source only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          roots=['stock-project-v2','multi-bagger-dashboard/monitoring/runs']
          records={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for root in roots for p in Path(root).rglob('*') if p.is_file()}
          Path('/tmp/preserved-mb30.json').write_text(json.dumps(records))
          PY
          python .migration/evidence30/finish_repair.py
          python - <<'PY'
          from pathlib import Path
          p=Path('multi-bagger-dashboard/watchlist_runtime.py');s=p.read_text();old="x['recorded_at']=ts;x['run_date']=ts[:10]";assert old in s
          s=s.replace(old,"x['recorded_at']=ts;x['run_date']=datetime.fromisoformat(ts.replace('Z','+00:00')).astimezone(ET).date().isoformat()")
          p.write_text(s)
          p=Path('multi-bagger-dashboard/index.html');s=p.read_text().replace('not yet certified for any of the 30','not yet certified for any stock in this run').replace('Every factor now has inputs and evidence.','Each available factor links to its saved inputs and evidence; unreviewed entries stay unscored.')
          p.write_text(s)
          PY
      - name: Install validation and browser dependencies
        run: |
          pip install -r multi-bagger-dashboard/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: mb30-primary-and-financial-evidence
          run-id: 34059685001
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained_evidence/new30
      - uses: actions/download-artifact@v4
        with:
          name: mb30-edgar-exhibits
          run-id: 34060171257
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained_evidence/edgar
      - uses: actions/download-artifact@v4
        with:
          name: mb30-supplementary-evidence
          run-id: 34060775624
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained_evidence/supplement
      - uses: actions/download-artifact@v4
        with:
          name: mb30-final-filing-gaps
          run-id: 34061760913
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained_evidence/final_gaps
      - name: Reconstruct all 30 scorecards and authorized Action10 assignment
        run: python -u multi-bagger-dashboard/evidence_tools/evidence_audit_builder.py
      - name: Validate data, missingness, calculation and immutable history
        run: |
          python -m unittest discover -s multi-bagger-dashboard -p 'test_*.py' -v
          python -m unittest discover -s stock-project-v2/tests -p 'test_multibagger_pass_score_storage.py' -v
          python stock-project-v2/scripts/store_multibagger_pass_scores.py --project-root stock-project-v2 --verify-repository
          python multi-bagger-dashboard/watchlist.py validate
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for path,h in json.loads(Path('/tmp/preserved-mb30.json').read_text()).items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==h,path
          x=json.loads(Path('multi-bagger-dashboard/monitoring/latest.json').read_text())
          assert len(x['stocks'])==30
          assert x['metadata']['action_count']==10 and x['metadata']['candidate_count']==20
          assert not x['metadata']['full_six_pass_complete']
          assert all(s['metadata']['audit']['verified_mb_score'] is None for s in x['stocks'])
          assert all(s['metadata']['research']['price_date']=='2026-09-04' for s in x['stocks'])
          print('All old snapshots and Stock V2 files preserved; 30 date-matched screening scorecards; no false full-research certification.')
          PY
      - name: Build and browser-test real standalone site
        run: |
          python multi-bagger-dashboard/build_site.py --output .multi-bagger-pages
          node --check .multi-bagger-pages/app.syntax-check.js
          python multi-bagger-dashboard/browser_smoke.py --site .multi-bagger-pages --output browser-proof
          rm .multi-bagger-pages/app.syntax-check.js
      - name: Preserve real verification outputs
        if: always()
        run: |
          mkdir -p release-proof
          cp -r .multi-bagger-pages release-proof/site 2>/dev/null || true
          cp -r browser-proof release-proof/browser 2>/dev/null || true
          tar -czf release-proof/source.tar.gz multi-bagger-dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mb30-finished-and-validated
          path: release-proof/
          retention-days: 30
      - name: Commit only tested application and evidence; no email or publishing
        run: |
          git diff --exit-code -- stock-project-v2 .github/workflows
          rm -rf .migration/evidence30
          find multi-bagger-dashboard -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add multi-bagger-dashboard
          git diff --cached --stat
          git commit -m 'Finish Multi Bagger 30 evidence repair, warning gates and authorized Action10 reassignment'
          git push origin HEAD:feature/mb30-evidence-repair-20260906
