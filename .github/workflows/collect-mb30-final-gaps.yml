name: Collect MB30 final filing gaps
on:
  push:
    branches: ['feature/mb30-evidence-repair-20260906']
    paths: ['.github/workflows/collect-mb30-final-gaps.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: multi-bagger-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Read exact source documents; do not modify scores or membership
        run: |
          python - <<'PY'
          import ast,json,concurrent.futures
          from pathlib import Path
          tree=ast.parse(Path('multi-bagger-dashboard/collect_evidence_supplement.py').read_text())
          nodes=[n for n in tree.body if isinstance(n,(ast.Import,ast.ImportFrom,ast.FunctionDef))]
          ns={};exec(compile(ast.Module(body=nodes,type_ignores=[]),'<source-reader>','exec'),ns)
          out=Path('mb30_final_gaps');out.mkdir();ns['NEW']=out
          rows=[
           ('IREN','2026-08-27','10-K','1878848/000187884826000052/iren-20260630.htm'),
           ('RGTI','2026-03-04','10-K','1838359/000110465926023454/rgti-20251231x10k.htm'),
           ('EVLV','2026-03-10','10-K','1805385/000180538526000012/evlv-20251231.htm'),
           ('EVLV','2026-08-11','10-Q','1805385/000180538526000049/evlv-20260630.htm'),
           ('SERV','2026-03-11','10-K','1832483/000183248326000010/patr-20251231.htm'),
           ('EOSE','2026-02-26','10-K','1805077/000162828026011961/eose-20251231.htm'),
           ('RKLB','2026-08-10','10-Q','1819994/000181999426000062/rklb-20260630.htm'),
           ('KTOS','2025-11-06','10-Q','1069258/000106925825000058/ktos-20250928.htm'),
           ('ETN','2025-11-04','10-Q','1551182/000155118225000036/etn-20250930.htm'),
           ('BKSY','2025-11-06','10-Q','1753539/000175353925000107/bksy-20250930.htm')]
          jobs=[]
          for t,d,f,p in rows:
           cik,acc,file=p.split('/')
           jobs.append({'ticker':t,'filed':d,'filed_date_precision':'Filing period verified; see canonical EDGAR header for acceptance date','form':f,'url':'https://www.sec.gov/Archives/edgar/data/'+p,'retrieval_url':'https://cdn.yahoofinance.com/prod/sec-filings/'+cik.zfill(10)+'/'+acc+'/'+file})
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:res=list(ex.map(ns['work'],jobs))
          (out/'inventory.json').write_text(json.dumps(res,indent=2))
          print(json.dumps({'documents':len(res),'retrieved':sum(x['status']=='retrieved' for x in res)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mb30-final-filing-gaps
          path: mb30_final_gaps/
          retention-days: 30
          if-no-files-found: error
